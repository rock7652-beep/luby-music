<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>公司支出｜陸比音樂</title><link rel="stylesheet" href="/assets/expenses.css"></head><body>
<div class="shell" id="app" hidden><header class="topbar"><a class="brand" href="/admin/"><img src="/assets/home/luby-logo.png" alt="陸比音樂"><span>公司支出</span></a><button class="quiet" id="logout">登出</button></header><main class="container"><section class="hero"><p class="eyebrow">LUBY EXPENSES</p><h1>支出快速登記</h1><p>手機記完就完成，不用再回備忘錄重抄。</p><div class="notice">測試版：資料目前只保存在這台裝置，不會寫入正式帳務。</div></section><section class="summary"><article class="stat"><small>8 月已登記</small><strong id="monthTotal">NT$0</strong></article><article class="stat reimburse"><small>待還給我的代墊</small><strong id="personalTotal">NT$0</strong></article><article class="stat"><small>2026 累計</small><strong id="yearTotal">NT$0</strong></article></section><div class="tabs"><button class="tab active" data-go="add">＋ 快速登記</button><button class="tab" data-go="records">支出明細</button><button class="tab" data-go="fixed">固定支出</button><button class="tab" data-go="export">匯出表格</button></div><div class="main-grid">
<section class="panel active" data-panel="add"><form class="card" id="expenseForm"><div class="section-head"><div><h2>新增一筆支出</h2><p>四個主要欄位，約 10 秒完成</p></div></div><div class="field"><label for="date">日期</label><input id="date" name="date" type="date" required></div><div class="field"><label for="item">支出項目</label><input id="item" name="item" placeholder="例如：運費、電費、蝦皮廣告" autocomplete="off" required></div><div class="field"><label for="amount">金額</label><div class="amount-wrap"><input id="amount" name="amount" type="number" inputmode="numeric" min="1" step="1" placeholder="0" required></div></div><div class="field"><label>付款方式</label><div class="segmented"><label class="choice"><input type="radio" name="payment" value="公司轉帳" checked><span>公司轉帳</span></label><label class="choice"><input type="radio" name="payment" value="個人代墊"><span>個人代墊</span></label></div></div><div class="field"><label for="note">備註（選填）</label><textarea id="note" name="note" placeholder="廠商、用途或信用卡資訊"></textarea></div><button class="primary" type="submit">儲存這筆支出</button><div class="success" id="saved">✓ 已儲存，可以繼續登記下一筆</div></form></section>
<section class="panel" data-panel="records"><div class="card"><div class="section-head"><div><h2>支出明細</h2><p id="recordCount"></p></div></div><div class="filters"><select id="monthFilter" aria-label="月份"><option value="8">8 月</option><option value="7">7 月</option><option value="all">全部月份</option></select><button class="secondary" id="clearTest">清除測試新增</button></div><div class="expense-list" id="expenseList"></div></div></section>
<section class="panel" data-panel="fixed"><div class="card"><div class="section-head"><div><h2>每月固定支出</h2><p>金額依年度調整，不會永久鎖死</p></div></div><div class="fixed-list" id="fixedList"></div></div></section>
<section class="panel" data-panel="export"><div class="card"><div class="section-head"><div><h2>輸出與備份</h2><p>保留公司可交接、可盤點的表格</p></div></div><div class="export-actions"><button id="exportCsv">下載支出明細 CSV<small>Numbers 與 Excel 都能開啟</small></button><button id="exportFixed">下載固定支出 CSV<small>每年調漲時可另存新版本</small></button></div></div></section></div></main>
<nav class="bottom-nav" aria-label="支出功能"><button class="navbtn active" data-go="add"><span>＋</span>登記</button><button class="navbtn" data-go="records"><span>≡</span>明細</button><button class="navbtn" data-go="fixed"><span>↻</span>固定</button><button class="navbtn" data-go="export"><span>⇩</span>匯出</button></nav></div>
<script src="/assets/expense-data.private.js"></script><script>
const seed=window.LUBY_EXPENSE_DATA||{baseMonthTotals:{},augustBase:[],fixed:[]};
const baseMonthTotals=seed.baseMonthTotals;
const augustBase=seed.augustBase;
const fixed=seed.fixed;
const key='luby-expense-preview-v1';const money=n=>'NT$'+Math.round(n).toLocaleString('zh-TW');const custom=()=>JSON.parse(localStorage.getItem(key)||'[]');const all=()=>[...augustBase,...custom()];
function refresh(){const rows=all(),aug=rows.filter(x=>x.date.startsWith('2026-08'));const month=aug.reduce((s,x)=>s+x.amount,0);const personal=rows.filter(x=>x.payment==='個人代墊').reduce((s,x)=>s+x.amount,0);const year=Object.values(baseMonthTotals).reduce((a,b)=>a+b,0)+month;document.querySelector('#monthTotal').textContent=money(month);document.querySelector('#personalTotal').textContent=money(personal);document.querySelector('#yearTotal').textContent=money(year);renderRows();}
function renderRows(){const filter=document.querySelector('#monthFilter').value;const rows=all().filter(x=>filter==='all'||Number(x.date.slice(5,7))===Number(filter)).sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));document.querySelector('#recordCount').textContent=`共 ${rows.length} 筆`;document.querySelector('#expenseList').innerHTML=rows.length?rows.map(x=>`<article class="expense"><div><h3>${escapeHtml(x.item)}</h3><div class="meta"><span>${x.date}</span><span class="pill ${x.payment==='個人代墊'?'personal':''}">${x.payment}</span>${x.note?`<span>${escapeHtml(x.note)}</span>`:''}</div></div><div class="money">${money(x.amount)}${x.base?'':`<button class="delete" data-delete="${x.id}">刪除</button>`}</div></article>`).join(''):'<div class="empty">這個月份還沒有支出</div>';}
function escapeHtml(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}function go(name){document.querySelectorAll('[data-panel]').forEach(x=>x.classList.toggle('active',x.dataset.panel===name));document.querySelectorAll('[data-go]').forEach(x=>x.classList.toggle('active',x.dataset.go===name));window.scrollTo({top:0,behavior:'smooth'})}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));document.querySelector('#expenseForm').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),rows=custom();rows.push({id:Date.now(),date:f.get('date'),item:f.get('item').trim(),amount:Number(f.get('amount')),payment:f.get('payment'),note:f.get('note').trim()});localStorage.setItem(key,JSON.stringify(rows));e.currentTarget.reset();document.querySelector('#date').value='2026-08-22';document.querySelector('[name=payment][value="公司轉帳"]').checked=true;document.querySelector('#saved').classList.add('show');setTimeout(()=>document.querySelector('#saved').classList.remove('show'),2500);refresh()});document.querySelector('#expenseList').addEventListener('click',e=>{const id=e.target.dataset.delete;if(!id)return;localStorage.setItem(key,JSON.stringify(custom().filter(x=>String(x.id)!==id)));refresh()});document.querySelector('#monthFilter').addEventListener('change',renderRows);document.querySelector('#clearTest').addEventListener('click',()=>{if(confirm('確定清除這台裝置新增的測試資料？')){localStorage.removeItem(key);refresh()}});
document.querySelector('#fixedList').innerHTML=fixed.map(x=>`<div class="fixed"><div><strong>${escapeHtml(x[0])}</strong><small>${x[2]}・2026 年基準，可年度調整</small></div><div class="money">${money(x[1])}</div></div>`).join('');
function csv(name,headers,rows){const text='\ufeff'+[headers,...rows].map(r=>r.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'}));a.download=name;a.click();URL.revokeObjectURL(a.href)}document.querySelector('#exportCsv').onclick=()=>csv('陸比支出明細-2026.csv',['日期','項目','金額','付款方式','備註'],all().sort((a,b)=>a.date.localeCompare(b.date)).map(x=>[x.date,x.item,x.amount,x.payment,x.note]));document.querySelector('#exportFixed').onclick=()=>csv('陸比固定支出-2026.csv',['項目','2026金額','週期','備註'],fixed.map(x=>[x[0],x[1],x[2],'每年依實際調漲更新']));
document.querySelector('#date').value='2026-08-22';async function auth(){const r=await fetch('/api/admin-auth',{cache:'no-store',credentials:'same-origin'});if(!r.ok){location.href='/admin/';return}document.querySelector('#app').hidden=false;refresh()}document.querySelector('#logout').onclick=async()=>{await fetch('/api/admin-auth',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'logout'})}).catch(()=>{});location.href='/admin/'};auth();
</script></body></html>
