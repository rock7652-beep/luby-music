<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>陸比音樂｜吉他保養預約管理</title>
<style>
html,body{margin:0;min-height:100%;background:#1a1f2e;color:#d0d8f0;font-family:system-ui,-apple-system,sans-serif}
body{display:grid;place-items:center}.loading{font-size:14px;letter-spacing:.12em;color:#8a93b0}
</style>
</head>
<body>
<div class="loading">正在開啟管理後台…</div>
<script>
fetch('/guitar-care/index.html', { cache: 'no-cache' })
  .then(function(response) {
    if (!response.ok) throw new Error('load failed');
    return response.text();
  })
  .then(function(html) {
    document.open();
    document.write(html);
    document.close();
  })
  .catch(function() {
    document.querySelector('.loading').textContent = '後台載入失敗，請重新整理後再試一次';
  });
</script>
</body>
</html>
