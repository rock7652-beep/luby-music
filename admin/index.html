<!DOCTYPE html>
<html lang="zh-TW"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>管理中心｜陸比音樂</title><link rel="stylesheet" href="/assets/admin-hub.css"></head>
<body>
<div class="login" id="login"><form class="login-card" id="loginForm"><img src="/assets/home/luby-logo.png" alt="陸比音樂"><p class="eyebrow">LUBY MUSIC</p><h1>管理中心</h1><p class="login-note">使用安全密碼登入後台</p><label for="password">管理密碼</label><div class="password-wrap"><input id="password" type="password" autocomplete="current-password" placeholder="請輸入管理密碼" required><button class="password-toggle" id="passwordToggle" type="button" aria-label="顯示密碼" aria-pressed="false">顯示</button></div><button type="submit">安全登入</button><div class="message" id="loginMessage" aria-live="polite"></div></form></div>
<main id="app" hidden>
<header><a class="brand" href="/admin/"><img src="/assets/home/luby-logo.png" alt="陸比音樂"><span><small>LUBY MUSIC</small><strong>管理中心</strong></span></a><button class="quiet" id="logout">安全登出</button></header>
<section class="welcome"><p class="eyebrow">ADMIN WORKSPACE</p><h1>今天要管理什麼？</h1><p>所有後台共用同一組安全登入，選擇工作即可開始。</p></section>
<section class="modules" aria-label="管理功能">
<a class="module module-primary" href="/admin/expenses/"><span class="icon" aria-hidden="true">支</span><span class="module-copy"><small>EXPENSES</small><strong>公司支出</strong><span>手機快速登記、個人代墊、固定支出與匯出</span></span><span class="arrow" aria-hidden="true">→</span></a>
<a class="module module-primary" href="/admin/guitar-care/"><span class="icon" aria-hidden="true">⌁</span><span class="module-copy"><small>BOOKING</small><strong>吉他保養預約</strong><span>管理開放日期、時段及預約狀態</span></span><span class="arrow" aria-hidden="true">→</span></a>
<a class="module" href="/admin/articles/"><span class="icon" aria-hidden="true">文</span><span class="module-copy"><small>CONTENT &amp; SEO</small><strong>文章與 SEO</strong><span>新增草稿、預覽並發布吉他知識文章</span></span><span class="arrow" aria-hidden="true">→</span></a>
</section>
<footer><a href="/">返回品牌首頁</a><span>陸比音樂後台系統</span></footer>
</main>
<script>
const $=id=>document.getElementById(id);async function api(options){const response=await fetch('/api/admin-auth',{cache:'no-store',credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options&&options.headers||{})}});const json=await response.json().catch(()=>({}));if(!response.ok)throw new Error(json.error||'操作失敗');return json}function enter(){$('login').hidden=true;$('app').hidden=false}function leave(message=''){$('app').hidden=true;$('login').hidden=false;$('loginMessage').textContent=message}async function check(){try{await api();enter()}catch{leave()}}$('passwordToggle').addEventListener('click',()=>{const visible=$('password').type==='text';$('password').type=visible?'password':'text';$('passwordToggle').textContent=visible?'顯示':'隱藏';$('passwordToggle').setAttribute('aria-label',visible?'顯示密碼':'隱藏密碼');$('passwordToggle').setAttribute('aria-pressed',String(!visible));$('password').focus()});$('loginForm').addEventListener('submit',async event=>{event.preventDefault();const button=event.submitter;button.disabled=true;$('loginMessage').textContent='驗證中…';try{await api({method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';$('password').type='password';$('passwordToggle').textContent='顯示';enter()}catch(error){$('loginMessage').textContent=error.message}finally{button.disabled=false}});$('logout').addEventListener('click',async()=>{await api({method:'POST',body:JSON.stringify({action:'logout'})}).catch(()=>{});leave('已安全登出')});check();
</script></body></html>
