<!DOCTYPE html>
<html lang="zh-TW">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>班級管理｜陸比音樂</title><link rel="stylesheet" href="/assets/admin-registrations.css"><link rel="stylesheet" href="/assets/admin-classes.css"></head>
<body>
<header><a href="/admin/" class="back">← 管理中心</a><strong>班級管理</strong><button id="refresh" type="button">重新整理</button></header>
<main>
  <section class="intro"><p class="eyebrow">LUBY CLASSES</p><h1>班級與招生</h1><p>門市與線上一起招生，名額由店長手動調整。儲存後官網立即套用，既有報名保留。</p></section>
  <div class="toolbar"><input id="search" type="search" aria-label="搜尋班級或老師" placeholder="搜尋班級、老師或星期"><button id="add" type="button" disabled>＋ 新增班級</button></div>
  <p id="message" role="status" aria-live="polite"></p>
  <section id="list" class="list" aria-label="班級清單"></section>
  <p><a href="/admin/registrations/">查看官網報名名單 →</a></p>
</main>
<dialog id="editor" aria-labelledby="editorTitle">
  <form id="classForm">
    <h2 id="editorTitle">編輯班級</h2>
    <div class="form-grid">
      <label class="wide">班級名稱<input name="name" required maxlength="80"></label>
      <label>老師<input name="teacher" required maxlength="80"></label>
      <label>程度<input name="level" required maxlength="80" list="levels"><datalist id="levels"><option>入門</option><option>初級</option><option>中級</option><option>進階彈唱</option><option>樂理編曲</option></datalist></label>
      <label>星期<select name="day"><option>週一</option><option>週二</option><option>週三</option><option>週四</option><option>週五</option><option>週六</option><option>週日</option></select></label>
      <label>上課時間<input name="time" type="time" required></label>
      <label>開課日期<input name="startDate" type="date" required></label>
      <label>結課日期<input name="endDate" type="date" required></label>
      <label>堂數<input name="lessons" type="number" min="1" max="365" required></label>
      <label>費用（元）<input name="price" type="number" min="0" max="1000000" required></label>
      <label>總名額（選填）<input name="capacity" type="number" min="1" max="999" placeholder="未設定"></label>
      <label>對外剩餘名額<input name="remaining" type="number" min="0" max="999" placeholder="留空不顯示名額"></label>
      <label class="wide">招生狀態<select name="status"><option value="open">開放報名</option><option value="paused">暫停報名</option><option value="full">已滿班</option></select></label>
    </div>
    <p class="help">剩餘名額填 0 會停止報名。官網收到申請不會自動扣名額，請依門市與線上實際招生調整。</p>
    <p id="formMessage" role="alert"></p>
    <div class="form-actions"><button id="cancel" type="button">取消</button><button id="save" type="submit" class="primary">儲存並更新官網</button></div>
  </form>
</dialog>
<script src="/assets/admin-classes.js"></script>
</body></html>
