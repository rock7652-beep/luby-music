<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>文章管理｜陸比音樂</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/admin-articles.css">
</head>
<body>
<div class="login" id="login">
  <form class="login-card" id="loginForm">
    <h1>陸比音樂</h1><div class="sub">文章管理後台</div>
    <input id="password" type="password" autocomplete="current-password" placeholder="請輸入管理密碼" required>
    <button class="btn btn-primary" type="submit">登入</button>
    <div class="message" id="loginMessage"></div>
  </form>
</div>

<main class="shell">
  <header class="top">
    <div class="brand"><img src="/assets/home/luby-logo.png" alt="陸比音樂"><div><div class="kicker">LUBY MUSIC</div><h1>內容管理中心</h1><div class="sub">撰寫、預覽並發布吉他知識文章</div></div></div>
    <div class="top-actions"><a class="btn" href="/admin/">管理首頁</a><a class="btn" href="/admin/guitar-care/">吉他保養</a><button class="btn" id="logout">安全登出</button></div>
  </header>
  <div class="notice">文章網址發布後建議不要更改；若一定要改，需同步設定 301 轉址，避免 SEO 排名與既有分享連結失效。</div>
  <section class="layout">
    <aside class="panel library">
      <div class="panel-head"><div><span class="section-label">CONTENT</span><h2>文章列表</h2></div><button class="btn btn-new" id="newArticle">＋ 新文章</button></div>
      <div class="library-tabs" role="tablist"><button class="tab active" type="button" id="activeTab">文章</button><button class="tab" type="button" id="trashTab">回收區 <span id="trashCount">0</span></button></div>
      <div class="list" id="articleList"><div class="empty">正在載入…</div></div>
    </aside>
    <section class="panel editor">
      <form id="editorForm">
        <input type="hidden" id="articleId">
        <div class="editor-heading"><div><span class="section-label">EDITOR</span><h2>編輯文章</h2></div><div class="editor-heading-actions"><span class="autosave-note">儲存後才會更新內容</span><button class="btn btn-danger" type="button" id="delete">移至回收區</button></div></div>
        <section class="form-section">
          <div class="form-section-head"><span>01</span><div><h3>基本資料</h3><p>文章標題、網址與列表中顯示的摘要</p></div></div>
          <div class="grid">
          <div class="field full"><label for="title">文章標題 <span class="hint" id="titleCount">0 / 120</span></label><input id="title" maxlength="120" required></div>
          <div class="field"><label for="slug">文章網址</label><input id="slug" placeholder="guitar-beginner-guide" pattern="[a-z0-9]+(?:-[a-z0-9]+)*" required></div>
          <div class="field"><label for="category">分類</label><input id="category" value="吉他知識"></div>
          <div class="field full"><label for="excerpt">文章摘要</label><textarea id="excerpt" maxlength="500" placeholder="用 1–2 句說明這篇文章能解決什麼問題"></textarea></div>
          </div>
        </section>
        <section class="form-section">
          <div class="form-section-head"><span>02</span><div><h3>圖片與文章內容</h3><p>加入封面、段落、小標題及內文照片</p></div></div>
          <div class="grid">
          <div class="field full"><label>封面照片</label><div class="cover" id="coverPreview"><span class="sub">尚未上傳封面照片</span></div><div class="upload-row"><input id="coverFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><button class="btn" type="button" id="uploadCover">上傳封面</button></div><input id="coverUrl" type="hidden"><input id="coverAlt" style="margin-top:8px" placeholder="照片替代文字（描述照片內容）"></div>
          <div class="field full"><label for="visualEditor">文章內文 <span class="hint">直接編輯排版，儲存後才會更新文章</span></label><div class="toolbar">
  <button class="btn" type="button" data-command="undo" aria-label="復原">↶ 復原</button>
  <button class="btn" type="button" data-command="redo" aria-label="重做">↷ 重做</button>
  <button class="btn" type="button" data-command="formatBlock" data-value="p">段落</button>
  <button class="btn" type="button" data-command="formatBlock" data-value="h2">小標題</button>
  <button class="btn" type="button" data-command="bold">粗體</button>
  <button class="btn" type="button" id="insertLink">插入文字連結</button>
  <button class="btn" type="button" data-command="insertUnorderedList">項目清單</button>
  <button class="btn" type="button" data-command="insertOrderedList">編號清單</button>
  <button class="btn toolbar-primary" type="button" id="insertPrimaryButton">＋ 主要按鈕</button>
  <button class="btn toolbar-secondary" type="button" id="insertSecondaryButton">＋ 次要按鈕</button>
  <button class="btn" type="button" id="insertImage">上傳內文照片</button>
  <button class="btn source-toggle" type="button" id="toggleSource">查看 HTML</button>
  <input id="bodyFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
</div>
<div class="visual-editor" id="visualEditor" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="從這裡開始撰寫文章…"></div>
<div class="image-settings" id="imageSettings" hidden>
  <div><strong>內文圖片設定</strong><span>點選文章中的圖片即可修改</span></div>
  <label>圖片替代文字<input id="imageAlt" maxlength="160" placeholder="簡短描述照片內容"></label>
  <label>圖片說明<input id="imageCaption" maxlength="200" placeholder="顯示在圖片下方，可留空"></label>
  <button class="btn btn-primary" type="button" id="applyImageSettings">套用圖片設定</button>
</div>
<textarea class="body source-editor" id="content" aria-label="文章 HTML 原始碼" hidden></textarea></div>
          </div>
        </section>
        <section class="form-section seo-section">
          <div class="form-section-head"><span>03</span><div><h3>Google 搜尋設定</h3><p>控制搜尋結果中顯示的標題與說明</p></div></div>
          <div class="grid">
          <div class="field full"><label for="seoTitle">SEO 標題 <span class="hint" id="seoTitleCount">0 / 120</span></label><input id="seoTitle" maxlength="120" placeholder="未填寫時會使用文章標題"></div>
          <div class="field full"><label for="seoDescription">SEO 摘要 <span class="hint" id="seoDescriptionCount">0 / 320</span></label><textarea id="seoDescription" maxlength="320" placeholder="Google 搜尋結果可能顯示的摘要"></textarea></div>
          </div>
        </section>
        <div class="message" id="message"></div>
        <div class="editor-actions"><button class="btn" type="button" id="preview">預覽</button><button class="btn btn-primary" type="button" id="saveDraft">儲存草稿</button><button class="btn btn-green" type="button" id="publish">發布文章</button></div>
      </form>
    </section>
  </section>
</main>
<script>
const $=id=>document.getElementById(id); let articles=[]; let trashArticles=[]; let selected=null; let dirty=false; let showingTrash=false; let selectedImage=null;
const TRASH_PREFIX='__trash__:';
function trashMeta(article){const match=String(article.category||'').match(/^__trash__:(published|draft):(.*)$/);return match?{status:match[1],category:match[2]||'吉他知識'}:null;}
function msg(text,type=''){ $('message').textContent=text; $('message').className='message '+type; }
function escapeHtml(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function safePreviewHtml(html){const doc=new DOMParser().parseFromString(`<div>${html}</div>`,'text/html');doc.querySelectorAll('script,iframe,object,embed,style,link,meta').forEach(el=>el.remove());doc.querySelectorAll('*').forEach(el=>{[...el.attributes].forEach(attr=>{const name=attr.name.toLowerCase(),value=attr.value.trim();if(name.startsWith('on')||name==='style'||((name==='href'||name==='src')&&!/^(https?:\/\/|\/)/i.test(value)))el.removeAttribute(attr.name);});});return doc.body.firstElementChild?.innerHTML||'';}
async function api(url,options={}){const r=await fetch(url,{credentials:'same-origin',...options,headers:{'Content-Type':'application/json',...(options.headers||{})}});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'操作失敗');return j;}
async function checkSession(){try{const r=await fetch('/api/admin-auth',{cache:'no-store',credentials:'same-origin'});if(!r.ok)throw 0;$('login').hidden=true;await loadArticles();}catch{$('login').hidden=false;}}
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;$('loginMessage').textContent='驗證中…';try{await api('/api/admin-auth',{method:'POST',body:JSON.stringify({password:$('password').value})});$('password').value='';$('login').hidden=true;await loadArticles();}catch(err){$('loginMessage').textContent=err.message;}finally{b.disabled=false;}});
$('logout').onclick=async()=>{await api('/api/admin-auth',{method:'POST',body:JSON.stringify({action:'logout'})}).catch(()=>{});$('login').hidden=false;};
function renderList(){
  $('activeTab').classList.toggle('active',!showingTrash);$('trashTab').classList.toggle('active',showingTrash);$('trashCount').textContent=trashArticles.length;
  if(showingTrash){
    if(!trashArticles.length){$('articleList').innerHTML='<div class="empty">回收區目前是空的</div>';return;}
    $('articleList').innerHTML=trashArticles.map(a=>{const meta=trashMeta(a)||{status:'draft',category:'吉他知識'};return `<div class="item trash-item"><div><div class="item-title">${escapeHtml(a.title)}</div><div class="item-meta"><span>原狀態：${meta.status==='published'?'已發布':'草稿'}</span><span>${new Date(a.updated_at).toLocaleDateString('zh-TW')}</span></div></div><button class="btn restore-btn" type="button" data-restore="${a.id}">復原</button></div>`;}).join('');
    document.querySelectorAll('[data-restore]').forEach(button=>button.onclick=()=>restoreFromTrash(button.dataset.restore));
    return;
  }
  if(!articles.length){$('articleList').innerHTML='<div class="empty">目前尚無文章</div>';return;}
  $('articleList').innerHTML=articles.map(a=>`<div class="item ${selected&&selected.id===a.id?'active':''}" data-id="${a.id}"><div class="item-title">${escapeHtml(a.title)}</div><div class="item-meta"><span class="status ${a.status}">${a.status==='published'?'已發布':'草稿'}</span><span>${new Date(a.updated_at).toLocaleDateString('zh-TW')}</span></div></div>`).join('');
  document.querySelectorAll('.item[data-id]').forEach(el=>el.onclick=()=>selectArticle(el.dataset.id));
}
async function loadArticles(){try{const j=await api('/api/articles');const all=j.articles||[];trashArticles=all.filter(a=>trashMeta(a));articles=all.filter(a=>!trashMeta(a));renderList();if(!selected&&!showingTrash)newArticle();}catch(err){msg(err.message,'error');$('articleList').innerHTML='<div class="empty">'+escapeHtml(err.message)+'</div>';}}
$('activeTab').onclick=()=>{showingTrash=false;renderList();$('editorForm').hidden=false;if(!selected)newArticle();};
$('trashTab').onclick=()=>{showingTrash=true;selected=null;renderList();$('editorForm').hidden=true;msg('回收區文章可隨時復原');};
async function restoreFromTrash(id){const article=trashArticles.find(a=>a.id===id);if(!article)return;const meta=trashMeta(article);if(!confirm(`確定復原「${article.title}」？`))return;try{await api('/api/articles',{method:'PATCH',body:JSON.stringify({action:'restore',id,restore_status:meta.status,restore_category:meta.category})});msg('文章已復原','ok');await loadArticles();}catch(error){msg(error.message,'error');}}
function syncVisualToSource(){$('content').value=$('visualEditor').innerHTML.trim();}
function syncSourceToVisual(){$('visualEditor').innerHTML=safePreviewHtml($('content').value);}
function values(){if(!$('content').hidden)syncSourceToVisual();syncVisualToSource();return{id:$('articleId').value||undefined,title:$('title').value.trim(),slug:$('slug').value.trim().toLowerCase(),category:$('category').value.trim(),excerpt:$('excerpt').value.trim(),cover_url:$('coverUrl').value,cover_alt:$('coverAlt').value.trim(),content_html:$('content').value,seo_title:$('seoTitle').value.trim(),seo_description:$('seoDescription').value.trim()};}
function fill(a){selectedImage=null;$('imageSettings').hidden=true;selected=a||null;$('articleId').value=a?.id||'';$('title').value=a?.title||'';$('slug').value=a?.slug||'';$('category').value=a?.category||'吉他知識';$('excerpt').value=a?.excerpt||'';$('coverUrl').value=a?.cover_url||'';$('coverAlt').value=a?.cover_alt||'';$('content').value=a?.content_html||'';syncSourceToVisual();$('visualEditor').hidden=false;$('content').hidden=true;$('toggleSource').textContent='查看 HTML';$('seoTitle').value=a?.seo_title||'';$('seoDescription').value=a?.seo_description||'';renderCover();counts();dirty=false;renderList();}
function newArticle(){if(dirty&&!confirm('尚未儲存的內容會消失，確定新增文章？'))return;fill(null);msg('新增文章模式');}
function selectArticle(id){if(dirty&&!confirm('尚未儲存的內容會消失，確定切換文章？'))return;fill(articles.find(a=>a.id===id));msg('');}
$('newArticle').onclick=newArticle;
function slugify(text){return text.toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/[\s-]+/g,'-').replace(/^-|-$/g,'');}
$('title').addEventListener('input',()=>{if(!$('articleId').value&&!$('slug').value)$('slug').value=slugify($('title').value);counts();dirty=true;});document.querySelectorAll('#editorForm input,#editorForm textarea').forEach(el=>el.addEventListener('input',()=>dirty=true));$('seoTitle').addEventListener('input',counts);$('seoDescription').addEventListener('input',counts);$('visualEditor').addEventListener('input',()=>{syncVisualToSource();dirty=true;});$('visualEditor').addEventListener('paste',e=>{e.preventDefault();const html=e.clipboardData.getData('text/html'),plain=e.clipboardData.getData('text/plain');const clean=html?safePreviewHtml(html):escapeHtml(plain).replace(/\n{2,}/g,'</p><p>').replace(/\n/g,'<br>');document.execCommand('insertHTML',false,clean);syncVisualToSource();dirty=true;});
function counts(){$('titleCount').textContent=$('title').value.length+' / 120';$('seoTitleCount').textContent=$('seoTitle').value.length+' / 120';$('seoDescriptionCount').textContent=$('seoDescription').value.length+' / 320';}
function renderCover(){const u=$('coverUrl').value;$('coverPreview').innerHTML=u?`<img src="${escapeHtml(u)}" alt="">`:'<span class="sub">尚未上傳封面照片</span>';}
async function fileBase64(file){return new Promise((resolve,reject)=>{const r=new FileReader;r.onload=()=>resolve(String(r.result).split(',')[1]);r.onerror=reject;r.readAsDataURL(file);});}
async function upload(file){if(!file)throw new Error('請先選擇圖片');if(file.size>5*1024*1024)throw new Error('圖片需小於 5MB');const j=await api('/api/article-image',{method:'POST',body:JSON.stringify({filename:file.name,contentType:file.type,base64:await fileBase64(file)})});return j.url;}
$('uploadCover').onclick=async()=>{const b=$('uploadCover');b.disabled=true;msg('正在上傳封面…');try{$('coverUrl').value=await upload($('coverFile').files[0]);renderCover();dirty=true;msg('封面上傳完成','ok');}catch(e){msg(e.message,'error');}finally{b.disabled=false;}};
function validLink(url){return /^(https?:\/\/|\/)/i.test(String(url||'').trim());}
function insertEditorHtml(html){if(!$('content').hidden)syncSourceToVisual();$('content').hidden=true;$('visualEditor').hidden=false;$('toggleSource').textContent='查看 HTML';$('visualEditor').focus();document.execCommand('insertHTML',false,html);syncVisualToSource();dirty=true;}
function askButton(kind){
  const primary=kind==='primary';
  const text=prompt(primary?'主要按鈕文字':'次要按鈕文字',primary?'預約吉他保養':'先詢問吉他狀況');if(text===null||!text.trim())return;
  const url=prompt('按鈕連結',primary?'/guitar-care/':'https://page.line.me/gay6872z');if(url===null)return;
  if(!validLink(url))return msg('連結需以 https:// 或 / 開頭','error');
  const cls=primary?'button button-dark':'button button-line';
  insertEditorHtml(`<p><a class="${cls}" href="${escapeHtml(url.trim())}">${escapeHtml(text.trim())}</a></p><p><br></p>`);
  msg(primary?'主要按鈕已插入':'次要按鈕已插入','ok');
}
$('insertPrimaryButton').onclick=()=>askButton('primary');
$('insertSecondaryButton').onclick=()=>askButton('secondary');
$('insertLink').onclick=()=>{
  const selection=window.getSelection()?.toString().trim()||'';
  const text=prompt('連結文字',selection||'查看詳細資訊');if(text===null||!text.trim())return;
  const url=prompt('連結網址','https://');if(url===null)return;
  if(!validLink(url))return msg('連結需以 https:// 或 / 開頭','error');
  insertEditorHtml(`<a href="${escapeHtml(url.trim())}">${escapeHtml(text.trim())}</a>`);
  msg('文字連結已插入','ok');
};
$('insertImage').onclick=()=>$('bodyFile').click();
$('bodyFile').onchange=async()=>{
  msg('正在上傳內文照片…');
  try{
    const url=await upload($('bodyFile').files[0]);
    const alt=prompt('請輸入圖片替代文字（讓搜尋引擎與無障礙工具了解照片）','')||'';
    const caption=prompt('請輸入圖片下方說明（可留空）','')||'';
    insertEditorHtml(`<figure><img src="${url}" alt="${escapeHtml(alt.trim())}"><figcaption>${escapeHtml(caption.trim())}</figcaption></figure><p><br></p>`);
    dirty=true;msg('照片已插入內文，之後點照片仍可修改說明','ok');
  }catch(e){msg(e.message,'error');}
  finally{$('bodyFile').value='';}
};
$('visualEditor').addEventListener('click',event=>{
  const image=event.target.closest?.('img');
  if(!image){selectedImage=null;$('imageSettings').hidden=true;return;}
  selectedImage=image;const figure=image.closest('figure');$('imageAlt').value=image.getAttribute('alt')||'';$('imageCaption').value=figure?.querySelector('figcaption')?.textContent||'';$('imageSettings').hidden=false;
});
$('applyImageSettings').onclick=()=>{
  if(!selectedImage)return msg('請先點選文章中的圖片','error');
  selectedImage.setAttribute('alt',$('imageAlt').value.trim());
  const figure=selectedImage.closest('figure');
  if(figure){let caption=figure.querySelector('figcaption');if(!caption){caption=document.createElement('figcaption');figure.appendChild(caption);}caption.textContent=$('imageCaption').value.trim();}
  syncVisualToSource();dirty=true;msg('圖片替代文字與說明已更新','ok');
};
document.querySelectorAll('[data-command]').forEach(b=>b.onclick=()=>{$('visualEditor').focus();document.execCommand(b.dataset.command,false,b.dataset.value||null);syncVisualToSource();dirty=true;});
$('toggleSource').onclick=()=>{if($('content').hidden){syncVisualToSource();$('visualEditor').hidden=true;$('content').hidden=false;$('toggleSource').textContent='返回視覺編輯';$('content').focus();}else{syncSourceToVisual();$('content').hidden=true;$('visualEditor').hidden=false;$('toggleSource').textContent='查看 HTML';$('visualEditor').focus();}};
async function save(status){const v=values();if(!v.title||!v.slug){msg('請填寫文章標題與網址','error');return;}const button=status==='published'?$('publish'):$('saveDraft');button.disabled=true;msg(status==='published'?'正在發布…':'正在儲存草稿…');try{v.status=status;const method=v.id?'PUT':'POST';const j=await api('/api/articles',{method,body:JSON.stringify(v)});selected=j.article;dirty=false;msg(status==='published'?'文章已發布，列表與 Sitemap 將自動更新':'草稿已儲存','ok');await loadArticles();fill(articles.find(a=>a.id===j.article.id));}catch(e){msg(e.message,'error');}finally{button.disabled=false;}}
$('saveDraft').onclick=()=>save('draft');$('publish').onclick=()=>confirm('確定要發布這篇文章？發布後一般訪客與搜尋引擎就能看到。')&&save('published');
$('delete').onclick=async()=>{if(!$('articleId').value)return msg('這篇尚未儲存，不需要移除');if(!confirm('確定將這篇文章移至回收區？之後可以復原。'))return;try{await api('/api/articles',{method:'DELETE',body:JSON.stringify({id:$('articleId').value,original_status:selected?.status||'draft',original_category:selected?.category||'吉他知識'})});selected=null;dirty=false;await loadArticles();newArticle();msg('文章已移至回收區','ok');}catch(e){msg(e.message,'error');}};
$('preview').onclick=()=>{const a=values();const w=open('','_blank');if(!w)return msg('瀏覽器阻擋了預覽視窗','error');w.document.write(`<!doctype html><meta charset="utf-8"><title>${escapeHtml(a.title||'文章預覽')}</title><link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="/assets/articles.css"><link rel="stylesheet" href="/assets/article-dynamic.css"><main class="article"><div class="eyebrow">PREVIEW</div><h1>${escapeHtml(a.title)}</h1><p class="lead">${escapeHtml(a.excerpt)}</p>${a.cover_url?`<img class="article-cover" src="${escapeHtml(a.cover_url)}" alt="${escapeHtml(a.cover_alt)}">`:''}<div class="article-content">${safePreviewHtml(a.content_html)}</div></main>`);w.document.close();};
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue='';}});checkSession();setInterval(checkSession,5*60*1000);
</script>
</body></html>
